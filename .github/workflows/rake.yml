name: rake

on:
  push:
    branches: [ master, main ]
    tags: [ v* ]
  pull_request:

permissions:
  contents: write
  # The shared rake workflow's tests-passed gate dispatches a
  # repository_dispatch; without actions:write the GITHUB_TOKEN fallback
  # fails with "Resource not accessible by integration" on every PR
  # (relaton-render#150). The remote cascade additionally needs the
  # METANORMA_CI_PAT_TOKEN secret to be present.
  actions: write

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/generic-rake.yml@main
    secrets:
      # This repo's org carries RELATON_CI_PAT (not the metanorma-org
      # METANORMA_CI_PAT_TOKEN the Cimas template names): without it the
      # gate's repository_dispatch falls back to the PR-context
      # GITHUB_TOKEN and fails on every PR (relaton-render#150).
      pat_token: ${{ secrets.RELATON_CI_PAT }}
